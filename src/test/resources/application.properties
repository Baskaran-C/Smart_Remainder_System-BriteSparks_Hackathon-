spring.application.name=SmartRemainderSystem-Test

# ============================================================
# In-Memory Database (H2) for Tests
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ============================================================
# Mock Mail SMTP
# ============================================================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test

# ============================================================
# Application Config (Fast for testing)
# ============================================================
app.reminder.evaluation-interval-minutes=1
app.reminder.max-per-appointment=5
app.reminder.cooldown-minutes=1
app.reminder.first-reminder-hours-before=1
app.reminder.max-retry-attempts=3
app.mail.from-name=Test System
app.mail.from-email=test@example.com

