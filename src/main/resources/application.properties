spring.application.name=SmartRemainderSystem

# Load secrets from gitignored file (see application-secrets.properties.example)
spring.config.import=optional:classpath:application-secrets.properties

# ============================================================
# MySQL Database — CONFIGURE BEFORE RUNNING
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/remaindersys
spring.datasource.username=root
# Password loaded from application-secrets.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Spring Mail (Brevo SMTP)
# ============================================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
# Username and password loaded from application-secrets.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-email=baskaranchandran612@gmail.com

# ============================================================
# Server
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# Application-level reminder settings
# ============================================================
# How many minutes before checking a WAITING reminder again
app.reminder.evaluation-interval-minutes=2
# Maximum reminders to send per appointment (anti-harassment)
app.reminder.max-per-appointment=5
# Cooldown after a SEEN reminder before sending another (minutes)
app.reminder.cooldown-minutes=30
# Minimum minutes before appointment to send the first reminder
app.reminder.first-reminder-hours-before=24
# Maximum delivery retry attempts before STOP
app.reminder.max-retry-attempts=3
# From-name for emails
app.mail.from-name=Smart Appointment Reminder

# ============================================================
# Logging
# ============================================================
logging.level.com.example.SmartRemainderSystem=INFO
logging.level.org.springframework.mail=WARN

# ============================================================
# CR-2026/11 — Rolling Contact Limit
# ============================================================
# Maximum outbound contact attempts per resident in any rolling 7-day window
app.contact-limit.max-per-7-days=2
